plugins { id 'com.android.library' }
android {
    namespace 'com.kazumaproject.zenz'
    compileSdk 35
    ndkVersion '28.2.13676358'
    if (providers.gradleProperty('zenzNdkPath').isPresent()) ndkPath providers.gradleProperty('zenzNdkPath').get()
    defaultConfig {
        minSdk 26
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake { arguments '-DGGML_NATIVE=OFF', '-DGGML_OPENMP=OFF', '-DGGML_LLAMAFILE=OFF', '-DLLAMA_CURL=OFF', '-DCMAKE_BUILD_TYPE=Release' } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
