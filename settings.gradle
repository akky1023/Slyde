pluginManagement {
    resolutionStrategy { eachPlugin {
        if (requested.id.id == 'org.jetbrains.kotlin.jvm') useModule("org.jetbrains.kotlin:kotlin-gradle-plugin:${requested.version}")
        if (requested.id.id == 'com.android.library') useModule("com.android.tools.build:gradle:${requested.version ?: '8.9.2'}")
    } }
    repositories { google(); mavenCentral(); gradlePluginPortal() }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories { google(); mavenCentral() }
}
rootProject.name = 'ArteInputRecorder'
include ':recorder'
include ':input-core', ':sumire-engine', ':prototype'
include ':zenz'
