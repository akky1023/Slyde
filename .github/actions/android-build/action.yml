name: Prepare Android build
description: Restore the SDK, dependencies and verified zenz inputs
runs:
  using: composite
  steps:
    - name: Select JDK and SDK
      id: paths
      shell: pwsh
      run: |
        "JAVA_HOME=$env:JAVA_HOME_17_X64" >> $env:GITHUB_ENV
        "sdk=$env:ANDROID_HOME" >> $env:GITHUB_OUTPUT
    - name: Cache Android native tools
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ${{ steps.paths.outputs.sdk }}/ndk/28.2.13676358
          ${{ steps.paths.outputs.sdk }}/cmake/3.22.1
        key: android-native-${{ runner.os }}-28.2.13676358-3.22.1
    - name: Install Android build tools
      shell: pwsh
      run: |
        $env:JAVA_HOME = $env:JAVA_HOME_17_X64
        & "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
        if ($LASTEXITCODE -ne 0) { throw 'Android SDK setup failed' }
    - name: Set up Gradle cache
      uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      with:
        cache-read-only: false
    - name: Cache zenz source and model
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          .tools/zenz-source
          prototype/src/main/assets/zenz/*.gguf
        key: zenz-inputs-${{ hashFiles('scripts/prepare-zenz.ps1') }}
    - name: Verify zenz inputs
      shell: pwsh
      run: ./scripts/prepare-zenz.ps1
