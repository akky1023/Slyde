name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build-apk:
        description: 'Build and verify a signed APK without publishing a release'
        type: boolean
        default: false
      release-tag:
        description: 'Existing release tag to build and attach APKs to (optional retry)'
        type: string
        default: ''

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_USER_HOME: ${{ github.workspace }}/.tools/gradle-home
  ANDROID_USER_HOME: ${{ github.workspace }}/.tools/android

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0 (Node.js 24)
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: ${{ inputs.build-apk || inputs.release-tag != '' }}
          skip-github-pull-request: ${{ inputs.build-apk || inputs.release-tag != '' }}

  test:
    needs: release
    if: needs.release.outputs.release_created == 'true' || inputs.build-apk == true || inputs.release-tag != ''
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 (Node.js 24)
        with:
          ref: ${{ needs.release.outputs.sha || inputs.release-tag || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/android-build
      - name: Run all unit tests
        shell: pwsh
        run: |
          ./gradlew.bat :input-core:test --rerun :sumire-engine:test --rerun :prototype:testDebugUnitTest --rerun --no-daemon --console=plain
          if ($LASTEXITCODE -ne 0) { throw 'Unit tests failed' }
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 14

  build-apk:
    needs: [release, test]
    if: needs.release.outputs.release_created == 'true' || inputs.build-apk == true || inputs.release-tag != ''
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 (Node.js 24)
        with:
          ref: ${{ needs.release.outputs.sha || inputs.release-tag || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/android-build
      - name: Cache native compilation
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            zenz/.cxx
            zenz/build/intermediates/cxx
          key: zenz-native-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties', 'scripts/prepare-zenz.ps1', 'zenz/src/main/cpp/**') }}
      - name: Build and verify signed APK
        env:
          GLIDE_KEYSTORE_BASE64: ${{ secrets.GLIDE_KEYSTORE_BASE64 }}
          GLIDE_STORE_PASSWORD: ${{ secrets.GLIDE_STORE_PASSWORD }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name || inputs.release-tag }}
        run: ./scripts/build-ci-release.ps1 -ExpectedVersion ($env:RELEASE_TAG -replace '^v', '') -SkipTests
      - name: Save verified APK and checksum
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Slyde-release-apk
          path: |
            dist/Slyde-*.apk
            dist/Slyde-*.apk.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Attach APK and checksum to GitHub Release
        if: needs.release.outputs.release_created == 'true' || inputs.release-tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name || inputs.release-tag }}
        run: |
          $assets = Get-ChildItem -LiteralPath dist -File | Where-Object Name -Match '^Slyde-.*\.apk(\.sha256)?$'
          & gh release upload $env:RELEASE_TAG @($assets.FullName)
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
